name: Battito

# Lotto «Valutazione 3» (D-VAL-84): nei repository pubblici GitHub spegne le corse a calendario
# dopo 60 giorni senza attività. Una volta al mese questo workflow scrive la data in battito.txt:
# così la copia trimestrale di OpenStreetMap non si spegne mai. Non tocca nient'altro.

on:
  schedule:
    - cron: '17 4 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  battito:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Scrive la data
        run: |
          date -u +'Ultimo battito: %Y-%m-%d %H:%M UTC' > battito.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add battito.txt
          git commit -m "Battito mensile $(date -u +%Y-%m)" || echo "Niente da registrare."
          git push
